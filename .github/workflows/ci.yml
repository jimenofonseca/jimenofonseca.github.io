name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate site
        # EN/DE key parity, HTML fallbacks vs en: values, JSON-LD, cache
        # version consistency. See validate.js for what each check guards.
        run: node validate.js
